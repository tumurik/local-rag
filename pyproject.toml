[project]
name = "local-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arturs T", email = "arturs.tumans@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.4",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.55.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "pywin32>=312",
]

[project.scripts]
local-rag = "local_rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
